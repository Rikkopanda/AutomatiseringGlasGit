[platformio]
; PlatformIO configuration for Control ESP (Master)
; This is the master node that controls the servo drive and coordinates with UI ESP

[env:control]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
monitor_eol = LF
monitor_echo = yes
mac-adress = 48:9d:31:c0:28:08

; Core dependencies
lib_deps =
    emelianov/modbus-esp8266 @ ^4.1.0

build_flags =
    -DCONTROL_ESP=1
    -I../shared

; Build type: debug or release
build_type = debug

; Source filter: only include control main
build_src_filter =
    +<control_main.cpp>
    +<modbus_master.cpp>
    +<driver_control.cpp>

; Serial port (adjust to your system)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
