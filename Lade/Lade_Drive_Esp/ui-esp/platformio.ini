[platformio]
; PlatformIO configuration for UI ESP (Slave)
; This is the slave node that handles all UI input (LCD, encoders, buttons, keypad)
; and communicates with the Control ESP via Modbus RTU

[env:ui]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
monitor_eol = LF
monitor_echo = yes
; Core dependencies
lib_deps =
    emelianov/modbus-esp8266 @ ^4.1.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
    -DUI_ESP=1
    -I../include
    -I../shared

; Build type: debug or release
build_type = debug

; Source filter: only include I2C test (no device)
build_src_filter =
    ; +<test_i2c_no_device.cpp>
    ; +<test_basic_i2c.cpp>
    ; +<minimal_check_lcd.cpp>
    +<ui_main.cpp>
    +<modbus_slave.cpp>
    +<lcd_display.cpp>
    +<rotary_encoder.cpp>
    +<button_handler.cpp>
    +<keypad_handler.cpp>

; Serial port (adjust to your system)
; upload_port = /dev/ttyUSB1
; monitor_port = /dev/ttyUSB1
